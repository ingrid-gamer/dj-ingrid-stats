<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DJPixula - Perfil de Spotify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .text-shadow {
      text-shadow: 0px 1px 3px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body class="pb-10 max-w-md mx-auto min-h-screen bg-neutral-900 border-x border-neutral-800">

  <!-- ENCABEZADO Y PERFIL -->
  <header class="relative">
    <div class="h-36 w-full overflow-hidden bg-neutral-800">
      <img 
        src="https://i.pinimg.com/736x/2a/b8/56/2ab856bdea4cf4577025f7f32daa2b66.jpg" 
        alt="Encabezado" 
        class="w-full h-full object-cover"
      />
    </div>

    <div class="px-4 relative flex justify-between items-end -mt-12 mb-3">
      <div class="relative">
        <img 
          src="https://i.pinimg.com/736x/0e/89/90/0e8990f4a1a440c557a8d8fa6f1063b6.jpg" 
          alt="DJPixula Avatar" 
          class="w-24 h-24 rounded-full border-4 border-neutral-900 object-cover shadow-lg"
        />
      </div>
      <div class="bg-neutral-800/90 backdrop-blur border border-neutral-700 px-3 py-1.5 rounded-full text-xs font-semibold text-neutral-200 shadow-md">
        <i class="fa-solid fa-headphones text-red-500 mr-1"></i>
        <span id="total-plays-count">...</span> reproducciones
      </div>
    </div>

    <div class="px-4">
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
        DJPixula
        <i class="fa-solid fa-circle-check text-red-500 text-sm"></i>
      </h1>
      <p class="text-xs text-neutral-400 mt-1">
        Estadísticas de reproducción filtradas
      </p>
    </div>
  </header>

  <main class="px-4 mt-6 space-y-8">

    <!-- RECIENTEMENTE ESCUCHADAS (Lista de 10) -->
    <section>
      <div class="flex items-center gap-2 mb-3 border-b border-neutral-800 pb-2">
        <i class="fa-solid fa-clock-rotate-left text-red-500"></i>
        <h2 class="text-base font-bold text-white uppercase tracking-wider text-xs">Recientemente escuchadas</h2>
      </div>
      <div id="recent-tracks-list" class="space-y-2">
        <div class="text-xs text-neutral-500 animate-pulse">Cargando reproducciones recientes...</div>
      </div>
    </section>

    <!-- COLLAGE VISUAL (Usando top canciones para mostrar carátulas) -->
    <section>
      <div class="flex items-center gap-2 mb-3 border-b border-neutral-800 pb-2">
        <i class="fa-solid fa-fire text-red-500"></i>
        <h2 class="text-base font-bold text-white uppercase tracking-wider text-xs">Artistas más escuchados</h2>
      </div>
      <div id="artists-collage" class="grid grid-cols-5 gap-1.5 w-full">
        <!-- Generado por JS -->
      </div>
    </section>

    <!-- TOP 10 CANCIONES RECIENTES -->
    <section>
      <div class="flex items-center gap-2 mb-3 border-b border-neutral-800 pb-2">
        <i class="fa-solid fa-flame text-orange-500"></i>
        <h2 class="text-base font-bold text-white uppercase tracking-wider text-xs">Top 10 canciones (Recientes)</h2>
      </div>
      <div id="top-tracks-month-list" class="space-y-2"></div>
    </section>

    <!-- TOP ÁLBUMES RECIENTES -->
    <section>
      <div class="flex items-center gap-2 mb-3 border-b border-neutral-800 pb-2">
        <i class="fa-solid fa-compact-disc text-purple-400"></i>
        <h2 class="text-base font-bold text-white uppercase tracking-wider text-xs">Top álbumes (Recientes)</h2>
      </div>
      <div id="top-albums-month-list" class="space-y-2"></div>
    </section>

    <!-- TOP 10 CANCIONES TODOS LOS TIEMPOS -->
    <section>
      <div class="flex items-center gap-2 mb-3 border-b border-neutral-800 pb-2">
        <i class="fa-solid fa-star text-yellow-500"></i>
        <h2 class="text-base font-bold text-white uppercase tracking-wider text-xs">Top 10 canciones (Todos los tiempos)</h2>
      </div>
      <div id="top-tracks-alltime-list" class="space-y-2"></div>
    </section>

    <!-- TOP 5 ÁLBUMES TODOS LOS TIEMPOS -->
    <section>
      <div class="flex items-center gap-2 mb-3 border-b border-neutral-800 pb-2">
        <i class="fa-solid fa-trophy text-amber-400"></i>
        <h2 class="text-base font-bold text-white uppercase tracking-wider text-xs">Top 5 álbumes (Todos los tiempos)</h2>
      </div>
      <div id="top-albums-alltime-list" class="space-y-2"></div>
    </section>

  </main>

  <!-- LÓGICA DE CONEXIÓN CON SUPABASE -->
  <script>
    // Credenciales exactas de tu código funcional anterior
    const SUPABASE_URL = 'https://zbovgcnqoavnmlybkhfj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpib3ZnY25xb2F2bm1seWJraGZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNDA1MTEsImV4cCI6MjEwNDkxNjUxMX0.BEoV7tFd4c6OKtvThJkTaHP5SKevOUnGBHCNtDbjSfE';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Formato de fecha para Chile
    function formatLocalDateTime(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return 'Fecha no disponible';

      return new Intl.DateTimeFormat('es-CL', {
        timeZone: 'America/Santiago',
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(date);
    }

    // Renderizado de las listas con carátula, título, álbum, artista y reproducciones/fecha
    function renderTrackItem(track) {
      const cover = track.album_cover || 'https://i.scdn.co/image/ab67616d00001e02167527ab3493b22cf94c03b1';
      const title = track.track_name || track.album_name || 'Desconocido';
      const isRecent = !!track.played_at;
      const timeLabel = isRecent ? formatLocalDateTime(track.played_at) : `${track.veces_reproducidas || 0} plays`;
      const albumName = track.album_name && title !== track.album_name ? ` • ${track.album_name}` : '';

      return `
        <div class="flex items-center gap-3 p-2 bg-neutral-800/40 rounded-lg border border-neutral-800/60 hover:bg-neutral-800 transition">
          <img src="${cover}" alt="Portada" class="w-12 h-12 rounded object-cover flex-shrink-0 bg-neutral-900" />
          <div class="flex-1 min-w-0">
            <h3 class="text-sm font-semibold text-white truncate">${title}</h3>
            <p class="text-xs text-neutral-400 truncate">${track.artist_name}${albumName}</p>
          </div>
          <span class="text-[10px] text-neutral-400 flex-shrink-0 ml-1 font-medium text-right leading-tight">
            ${timeLabel.replace(' ', '<br>')}
          </span>
        </div>
      `;
    }

    async function loadProfileData() {
      try {
        // 1. Total reproducciones
        const { count } = await supabase.from('view_recent_plays').select('*', { count: 'exact', head: true });
        document.getElementById('total-plays-count').innerText = count ? count.toLocaleString('es-CL') : '...';

        // 2. Recientemente Escuchadas (Últimas 10)
        const { data: recent } = await supabase.from('view_recent_plays')
          .select('*')
          .order('played_at', { ascending: false })
          .limit(10);
        if (recent) {
          document.getElementById('recent-tracks-list').innerHTML = recent.map(renderTrackItem).join('');
        }

        // 3. Collage de Artistas (Extraídos del top histórico)
        const { data: topArtists } = await supabase.from('view_top_tracks_all_time')
          .select('*')
          .order('veces_reproducidas', { ascending: false })
          .limit(10);
        
        if (topArtists) {
          document.getElementById('artists-collage').innerHTML = topArtists.map(artist => `
            <div class="aspect-square relative rounded overflow-hidden bg-neutral-800 shadow-sm border border-neutral-700/50">
              <img src="${artist.album_cover || 'https://i.scdn.co/image/ab67616d00001e02167527ab3493b22cf94c03b1'}" 
                   class="w-full h-full object-cover" />
              <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-transparent flex flex-col justify-end p-1">
                <span class="text-[9px] font-bold text-white truncate leading-tight text-shadow">${artist.artist_name}</span>
                <span class="text-[7px] text-neutral-300 font-semibold uppercase tracking-wider">${artist.veces_reproducidas} plays</span>
              </div>
            </div>
          `).join('');
        }

        // 4. Top 10 Canciones (Recientes / 90 días)
        const { data: monthTracks } = await supabase.from('view_top_tracks_recent')
          .select('*')
          .order('veces_reproducidas', { ascending: false })
          .limit(10);
        if (monthTracks) {
          document.getElementById('top-tracks-month-list').innerHTML = monthTracks.map(renderTrackItem).join('');
        }

        // 5. Top Álbumes (Recientes)
        const { data: monthAlbums } = await supabase.from('view_top_albums_recent')
          .select('*')
          .order('veces_reproducidas', { ascending: false })
          .limit(5);
        if (monthAlbums) {
          document.getElementById('top-albums-month-list').innerHTML = monthAlbums.map(renderTrackItem).join('');
        }

        // 6. Top 10 Canciones (Todos los Tiempos)
        const { data: alltimeTracks } = await supabase.from('view_top_tracks_all_time')
          .select('*')
          .order('veces_reproducidas', { ascending: false })
          .limit(10);
        if (alltimeTracks) {
          document.getElementById('top-tracks-alltime-list').innerHTML = alltimeTracks.map(renderTrackItem).join('');
        }

        // 7. Top 5 Álbumes (Todos los Tiempos)
        const { data: alltimeAlbums } = await supabase.from('view_top_albums_all_time')
          .select('*')
          .order('veces_reproducidas', { ascending: false })
          .limit(5);
        if (alltimeAlbums) {
          document.getElementById('top-albums-alltime-list').innerHTML = alltimeAlbums.map(renderTrackItem).join('');
        }

      } catch (err) {
        console.error("Error al cargar las estadísticas:", err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadProfileData);
  </script>
</body>
</html>
